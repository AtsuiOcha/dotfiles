# uv global configuration.
# Symlinked to ~/.config/uv/uv.toml by install.sh (via config/.config/* loop).
# Read by uv because XDG_CONFIG_HOME=~/.config is exported in ~/.zshenv.

# Vast Artifactory index. Mirrors public PyPI AND hosts internal packages
# (e.g. seclib). Single authenticated source of truth.
[[index]]
name = "vast"
url = "https://artifactory.int.vastspace.com/artifactory/api/pypi/vast-pypi/simple"
