# https://hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

# Ensure XDG_CONFIG_HOME is in the tmux server environment so every pane,
# nvim, and lazygit (incl. neolazygit) resolves config from ~/.config.
# Without this, lazygit falls back to ~/Library/Application Support/lazygit.
set-environment -g XDG_CONFIG_HOME "$HOME/.config"

# remap prefix from 'C-b' to 'C-s'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix


#This adds vim bindings to tmux
set-window-option -g mode-keys vi


# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %


# switch panes using Alt-arrow without prefix
bind -n M-Left previous-window
bind -n M-Right next-window
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

# Set tabs to keys
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Fuzzy window picker (current session only) - prefix + f
bind f display-popup -E "tmux list-windows -F '#{window_index} #{window_name}' | fzf --reverse | cut -d' ' -f1 | xargs tmux select-window -t"

# Fuzzy window picker (all sessions) - prefix + F
bind F display-popup -E "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf --reverse | cut -d' ' -f1 | xargs tmux switch-client -t"

# Project picker (lazy load projects) - prefix + p
bind p display-popup -E "~/.tmux/project_picker.sh"

# For some reason v doesn't work, hopefully this fixes the problem
bind -T copy-mode-vi v send -X begin-selection


# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
set -g base-index 1
set -g history-limit 50000

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Focus events for Neovim autoread and gitgutter
set -g focus-events on


# don't rename windows automatically

set-option -g allow-rename off

# Copy yanked items to clipboard
set -g set-clipboard on

# The stuff underneath is broken

# Fix the meta key stuff in tmux
# set -g terminal-overrides "*:kUP3=\e[1;9A,*:kDN3=\e[1;9B,*:kRIT3=\e[1;9C,*:kLFT3=\e[1;9D"

# Super important:
# https://github.com/neovim/neovim/issues/2035
# Nvim now uses libtermkey for parsing keys, that means alt key combinations are detected by default. So, if you have a 500 ms escape time and press esc+i, tmux will immediately send ^[i which is interpreted by libtermkey as alt+i.
#
# Vim does not detect alt combinations in terminals by default(source), so when it receives ^[i which doesn't match any terminfo key sequence, it will parse as the keys esc and i separately.
#
# If you want to avoid this kind of problem, use a low escape-time value(I dont recommend 0), personally I use 10 milliseconds.
#
set -sg escape-time 0



# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf





# From https://www.youtube.com/watch?v=H70lULWJeig
# TPM
# On a new system, you'll need to run:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# for vim
set -g @resurrect-strategy-vim 'session'
# for neovim
set -g @resurrect-strategy-nvim 'session'
# Syling
set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme '#16e91f'
set -g @tmux_power_show_host  false
set -g @tmux_power_show_user false
# Open lazygit in a popup (prefix + G). Its editor.sh is patched for macOS by
# install.sh (see tmux/.tmux/scripts/neolazygit-editor.sh).
set -g @plugin 'AngryMorrocoy/tmux-neolazygit'
set -g @open-lazygit 'G'

# set -g status-right "%H:%M %d-%b-%y"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
set-option -g renumber-windows on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# tmux 3.7+ needs fill= in the message styles for the command prompt to fully
# clear the status line (stock defaults have it; tmux-power drops it). Deferred
# via run so it applies after tpm/tmux-power load and survives `prefix + r`.
run -b "tmux set -g message-command-style 'fg=#16e91f,bg=#262626,fill=#262626'; tmux set -g message-style 'fg=#16e91f,bg=#262626,fill=#262626'"
